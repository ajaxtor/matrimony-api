<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Login Test</title>

    <style>
        body {
            margin: 0; padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #4c6ef5, #b197fc);
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        .card {
            width: 380px;
            background: rgba(255,255,255,0.15);
            padding: 25px;
            border-radius: 16px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.3);
            text-align: center;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .title { font-size: 22px; margin-bottom: 20px; font-weight: 600; }

        .google-btn {
            width: 100%; padding: 12px;
            background: #fff; color: #444;
            border: none; border-radius: 8px;
            font-size: 16px; font-weight: 500;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s;
        }

        .google-btn:hover { background: #f1f1f1; transform: translateY(-2px); }

        .response-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.4);
            padding: 12px; border-radius: 8px;
            color: #d9d9d9;
            max-height: 200px; overflow-y: auto;
            white-space: pre-wrap; text-align: left;
        }

        .footer { margin-top: 15px; font-size: 12px; opacity: 0.8; }
    </style>

</head>
<body>

<div class="card">
    <div class="title">Login with Google</div>

    <button class="google-btn" onclick="googleLogin()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Google_2015_logo.svg" width="20" />
        Continue with Google
    </button>

    <pre id="result" class="response-box">Waiting for login...</pre>

    <div class="footer">Powered by Firebase + Spring Boot</div>
</div>

<!-- FIXED: Firebase v8 SDK (supports firebase.auth()) -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyBLQan-LHZRbUqtdGVjhtLCm-czMh3YgrY",
        authDomain: "dhol-matrimony-ef849.firebaseapp.com",
        projectId: "dhol-matrimony-ef849",
        storageBucket: "dhol-matrimony-ef849.firebasestorage.app",
        messagingSenderId: "125005373330",
        appId: "1:125005373330:web:14d528595627b88f066b4b",
        measurementId: "G-BZ3KHCSWL1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    async function googleLogin() {
        try {
            document.getElementById("result").innerText = "Opening Google Login...";

            const result = await auth.signInWithPopup(provider);
            const idToken = await result.user.getIdToken();

            document.getElementById("result").innerText =
                "Firebase ID Token retrieved.\nSending to Spring Boot...";

            const response = await fetch("http://localhost:9999/api/v1/auth/social-login", {
                method: "POST",
                headers: { "Authorization": "Bearer " + idToken }
            });

            const data = await response.json();

            document.getElementById("result").innerText =
                "Spring Boot Response:\n\n" + JSON.stringify(data, null, 2);

        } catch (err) {
            document.getElementById("result").innerText = "Error:\n" + err.message;
        }
    }
</script>

</body>
</html>
